[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hisham-assistant-api"
version = "0.1.0"
description = "FastAPI assistant service for Hisham Khashman's portfolio"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "openai>=1.0,<2"
]

[tool.setuptools]
py-modules = ["main"]

