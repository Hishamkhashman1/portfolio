[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hisham-ai-backend"
version = "0.1.0"
description = "FastAPI backend for Hisham's portfolio assistant"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]==0.140.0",
    "uvicorn[standard]==0.51.0",
    "pydantic==2.13.4",
]

[tool.fastapi]
entrypoint = "backend.app.main:app"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]
namespaces = true
